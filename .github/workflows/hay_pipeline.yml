name: Hay Intelligence Pipeline

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * 5'
    - cron: '30 8 1 * *'
  workflow_dispatch:

jobs:
  hay-pipeline:
    name: Hay Intelligence (Real Data Only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            pystac-client \
            planetary-computer \
            stackstac \
            xarray \
            numpy \
            pandas \
            scipy \
            requests \
            python-dotenv \
            yfinance \
            feedparser

      - name: Run hay NDVI + SAR pipeline (real data only)
        run: python scripts/hay_pipeline.py
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}

      - name: Fetch hay prices
        run: python scripts/fetch_hay_prices.py

      - name: Generate hay signals (skips nodes without real data)
        run: python scripts/hay_signals.py
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: gpt-oss:20b

      - name: Data quality report
        run: |
          echo "Real data nodes:"
          ls data/hay/ndvi/ 2>/dev/null | wc -l || echo 0
          echo "Skipped nodes (no real data):"
          ls data/hay/skipped/ 2>/dev/null | wc -l || echo 0

      - name: Commit outputs
        run: |
          git config user.name  "quantagri-bot"
          git config user.email "bot@quantagri.local"
          git add data/hay/
          git diff --staged --quiet \
            && echo "Nothing to commit" \
            || (git commit -m "chore: hay pipeline $(date -u '+%Y-%m-%d %H:%M UTC')" \
            && git pull --rebase origin main \
            && git push origin main)
